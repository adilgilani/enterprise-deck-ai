# Local development stack:  docker compose up
#   frontend  http://localhost:8080      backend  http://localhost:8000/docs
#   minio     http://localhost:9001      postgres (pgvector) localhost:5432
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eai
      POSTGRES_PASSWORD: eai-dev-password
      POSTGRES_DB: eai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eai -d eai"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eai-minio
      MINIO_ROOT_PASSWORD: eai-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://eai:eai-dev-password@postgres:5432/eai
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: arq
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: eai-minio
      MINIO_SECRET_KEY: eai-minio-secret
      MINIO_BUCKET: enterprise-ai
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081
      PUBLIC_APP_URL: http://localhost:8080
    command: sh -c "python -m app.cli bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    command: arq app.worker.WorkerSettings
    depends_on:
      backend: { condition: service_started }

  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bunx vite dev --host 0.0.0.0 --port 8080"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["8080:8080"]
    volumes: [".:/app", "/app/node_modules"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
